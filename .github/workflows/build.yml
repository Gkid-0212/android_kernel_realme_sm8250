name: Build KernelSU Next
on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 步骤 1：用原生 git 克隆代替 checkout 插件
    - name: Clone Source Code
      run: |
        git clone --branch Entropy-1.2 --depth 1 https://github.com/Gkid-0212/android_kernel_realme_sm8250.git $GITHUB_WORKSPACE

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libtinfo5
        
    - name: Download Clang Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        curl -LO "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz"
        tar -xzf clang-r450784d.tar.gz
        rm clang-r450784d.tar.gz

    - name: Integrate KernelSU
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

    - name: Build Kernel
      run: |
        cd $GITHUB_WORKSPACE
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        
        make O=out ARCH=arm64 gki_defconfig
        
        echo "CONFIG_KSU=y" >> out/.config
        echo "CONFIG_KPROBES=y" >> out/.config
        echo "CONFIG_HAVE_KPROBES=y" >> out/.config
        echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
        
        make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang

    - name: Package with AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE
        git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
        else
          cp out/arch/arm64/boot/Image AnyKernel3/Image
        fi
        cd AnyKernel3
        zip -r9 ../AnyKernel3-KernelSU-Entropy.zip * -x .git* README.md

    # 步骤 2：使用免费的 transfer.sh 代替 artifacts 插件上传产物
    - name: Upload Zip Pack
      run: |
        cd $GITHUB_WORKSPACE
        echo "--------------------------------------------------------"
        echo "开始上传编译好的卡刷包，请注意保存下方生成的下载链接："
        echo "--------------------------------------------------------"
        curl --upload-file ./AnyKernel3-KernelSU-Entropy.zip https://transfer.sh/AnyKernel3-KernelSU-Entropy.zip
        echo -e "\n--------------------------------------------------------"
